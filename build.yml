name: Direct P4A Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake libtool pkg-config build-essential git zip unzip zlib1g-dev libncurses5-dev libffi-dev

    - name: Install p4a and Cython
      run: |
        python3 -m pip install --upgrade pip
        pip install --upgrade cython
        pip install --upgrade git+https://github.com/kivy/python-for-android.git@master

    - name: Build APK Directly with p4a
      run: |
        p4a create \
          --private . \
          --package org.globalsmart.academy \
          --name "Global Smart Academy" \
          --version 1.0 \
          --bootstrap sdl2 \
          --requirements python3,kivy,pyjnius,requests,certifi,urllib3,idna,chardet,filetype \
          --orientation portrait \
          --dest-dir ./bin

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
