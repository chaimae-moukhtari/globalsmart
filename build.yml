[app]

# (str) Title of your application
title = Global Smart

# (str) Package name
package.name = globalsmart

# (str) Package domain (needed for android packaging)
package.domain = org.globalsmart

# (list) Source files to include (let it blank to include all files)
source.include_exts = py,png,jpg,kv,atlas

# (list) Source files to exclude (let it blank to exclude nothing)
source.exclude_exts = spec

# (list) List of directory to exclude from source files
source.exclude_dirs = bin, venv, .git, .github

# (list) List of extensions to exclude from source files
#source.exclude_exts = spec

# (list) Application requirements
# (comma separated e.g. requirements = sqlite3,kivy)
requirements = python3,kivy,pyjnius,libffi,requests,idna,filetype,certifi,chardet,urllib3,six

# (str) Supported orientations (landscape, portrait or all)
orientation = portrait

# (list) The Android specific application requirements
#android.permissions = INTERNET

# (int) Target Android API, should be as high as possible.
android.api = 34

# (int) Minimum API your APK will support.
android.minapi = 21

# (str) Android NDK version to use
#android.ndk = 25b

# (bool) Use --private data storage (True) or --dir storage (False)
android.private_storage = True

# (str) The format used to package the app for release/debug (apk or aab)
android.archs = arm64-v8a
